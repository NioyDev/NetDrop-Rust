plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nioydev.netdrop'
    compileSdk 34

    defaultConfig {
        applicationId "com.nioydev.netdrop"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero bloated third-party dependencies - Clean Android Core
}
