<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NetDrop - Compartir Archivos en Red Local</title>
    <link rel="stylesheet" href="/static/css/variables.css?v=11">
    <link rel="stylesheet" href="/static/css/layout-variables.css?v=11">
    <link rel="stylesheet" href="/static/css/global.css?v=11">
    <link rel="stylesheet" href="/static/css/componentes.css?v=11">
    <link rel="stylesheet" href="/static/css/Files.css?v=11">
    <link rel="icon" href="/static/Logo/logo-sin-fondo.png" type="image/png">
    <link rel="shortcut icon" href="/static/Logo/logo-sin-fondo.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/Logo/logo-sin-fondo.png">
    <script src="/static/js/theme-engine.js?v=11"></script>
</head>
<body oncontextmenu="return false;">

    <header class="app-header">
        <div class="header-container">
            <a href="/" class="brand-logo">
                <img src="/static/Logo/logo-sin-fondo.png" alt="NetDrop Logo" class="logo-img">
                <span class="brand-name">NetDrop</span>
            </a>

            <div class="header-right-actions">
                <nav class="nav-links">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Archivos</a>
                    <a href="/update" class="nav-link {% if request.path == '/update' %}active{% endif %}">Subir</a>
                    <button type="button" class="nav-link-btn" data-action="open-qr" title="Escanear QR para compartir en móvil">Código QR</button>
                    <a href="/settings" class="nav-link nav-settings-btn {% if request.path == '/settings' %}active{% endif %}" title="Ajustes de temas">
                        <svg class="gear-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Barra de Navegación Inferior Móvil (Thumb Zone) -->
    <nav class="app-bottom-nav" aria-label="Navegación Móvil">
        <a href="/" class="bottom-nav-item {% if request.path == '/' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Archivos</span>
        </a>
        <a href="/update" class="bottom-nav-item {% if request.path == '/update' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Subir</span>
        </a>
        <button type="button" class="bottom-nav-item" data-action="open-qr" title="Escanear Código QR">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>QR</span>
        </button>
        <a href="/settings" class="bottom-nav-item {% if request.path == '/settings' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Ajustes</span>
        </a>
    </nav>

    <!-- Modal Rápido / Bottom Sheet de Código QR -->
    <div id="qrModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
        <div class="modal-content">
            <div class="bottom-sheet-handle"></div>
            <div class="modal-header-row">
                <h2 id="qrModalTitle">Conectar Móvil</h2>
                <button type="button" class="modal-close" data-action="close-qr" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="qr-modal-body">
                <div class="qr-modal-img-frame">
                    <img src="/qr-image" alt="Código QR" class="qr-modal-img" loading="lazy">
                </div>
                <div class="qr-wifi-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                    <span>Conéctate a la misma red Wi-Fi</span>
                </div>
                <div class="ip-copy-box">
                    <code id="ipAddressText">{{ protocolo | default(value="http") }}://{{ ip_local | default(value="127.0.0.1") }}:5000</code>
                    <div class="ip-buttons-group">
                        <button type="button" class="btn-copy-small" data-action="copy-ip" title="Copiar IP">Copiar</button>
                        <button type="button" class="btn-share-small" data-action="share-ip" title="Compartir enlace">Compartir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación Genérico / Descarga -->
    <div id="downloadModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="bottom-sheet-handle"></div>
            <div class="modal-header-row">
                <h2 id="modalTitle">Confirmación</h2>
                <button type="button" class="modal-close" data-action="close-download-modal" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modalBody">
                <p id="modalMessage"></p>
                <div id="modalButtons" class="modal-actions">
                    <button type="button" data-action="close-download-modal" class="modal-btn modal-btn-secondary">Cancelar</button>
                    <button type="button" data-action="close-download-modal" class="modal-btn modal-btn-primary" id="primaryBtn">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="/static/js/global.js?v=11" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
