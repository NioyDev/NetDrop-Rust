{% extends "layout.html" %}

{% block content %}

<div class="page-container">
    <div class="form-card">
        <div class="form-header">
            <h1 class="page-title">Subir archivo</h1>
            <p class="page-subtitle">Cualquier equipo o teléfono conectado a la red local podrá descargarlo de inmediato.</p>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data" class="upload-form" id="UploadForm">
            
            <div class="drop-zone" id="DropZone">
                <input type="file" name="UPFile" id="UPFile" class="file-input" required aria-label="Seleccionar archivo" />
                <div class="drop-zone-inner">
                    <p class="drop-title" id="DropTitle">Arrastra un archivo aquí</p>
                    <p class="drop-subtitle" id="DropSubtitle">o pulsa para explorar en tu teléfono o PC</p>
                    <span class="file-badge" id="FileInfoBadge" style="display: none;"></span>
                </div>
            </div>
            
            <div class="progress-section" id="ProgressSection" style="display: none;">
                <div class="progress-info">
                    <span id="UploadStatus">Subiendo...</span>
                    <span id="UploadPercentage" class="mono">0%</span>
                </div>
                <div class="progress-track">
                    <div id="ProgressBarFill" class="progress-fill" style="transform: scaleX(0);"></div>
                </div>
            </div>

            <div class="form-actions">
                <a href="/" class="btn-subtle">Cancelar</a>
                <button type="submit" class="btn-primary" id="SubmitBtn" disabled>Enviar archivo</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/upload.js" defer></script>
{% endblock %}
