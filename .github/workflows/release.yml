name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Windows (Portable Zip & Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar binario en Release
        run: cargo build --release --bin netdrop

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Crear Instalador Inno Setup (NetDrop-Rust-Setup.exe)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" distribucion/NetDrop-Setup.iss

      - name: Preparar ZIP Portable (NetDrop-Rust-Windows-x64.zip)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist/zip_content
          Copy-Item target/release/netdrop.exe dist/zip_content/
          Copy-Item LICENSE dist/zip_content/
          Copy-Item README.md dist/zip_content/
          Compress-Archive -Path dist/zip_content/* -DestinationPath dist/NetDrop-Rust-Windows-x64.zip -Force

      - name: Subir artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/NetDrop-Rust-Setup.exe
            dist/NetDrop-Rust-Windows-x64.zip

  build-linux:
    name: Compilar Linux (.tar.gz & .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependencias WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2

      - name: Compilar binario en Release
        run: cargo build --release --bin netdrop

      - name: Instalar cargo-deb
        run: cargo install cargo-deb --locked

      - name: Construir paquete .deb (netdrop-rust_amd64.deb)
        run: |
          mkdir -p dist
          cargo deb -p netdrop -o dist/netdrop-rust_amd64.deb

      - name: Empaquetar Linux Tarball (NetDrop-Rust-Linux-x64.tar.gz)
        run: |
          mkdir -p dist/tar_content
          cp target/release/netdrop dist/tar_content/
          cp LICENSE dist/tar_content/
          cp README.md dist/tar_content/
          cp distribucion/NetDrop.desktop dist/tar_content/
          tar -czvf dist/NetDrop-Rust-Linux-x64.tar.gz -C dist/tar_content .

      - name: Subir artefactos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/NetDrop-Rust-Linux-x64.tar.gz
            dist/netdrop-rust_amd64.deb

  publish-release:
    name: Publicar GitHub Release Unificada
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && success()
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets/

      - name: Descargar artefactos Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets/

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: NetDrop-Rust ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
