name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Formato y Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Instalar dependencias WebKit (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings

  test-linux:
    name: Pruebas unitarias e integración (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependencias WebKit (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Ejecutar tests
        run: cargo test --lib

  test-windows:
    name: Pruebas unitarias e integración (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ejecutar tests
        run: cargo test --lib
